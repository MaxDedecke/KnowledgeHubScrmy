services:
  db:
    image: postgres:16
    container_name: knowledge-hub-db
    environment:
      POSTGRES_USER: knowledge
      POSTGRES_PASSWORD: knowledge
      POSTGRES_DB: knowledge
    volumes:
      - db-data:/var/lib/postgresql/data
    # Prüft gegen Cluster-Superuser "postgres" und Datenbank "postgres":
    # beide existieren in jedem Postgres-Cluster, egal ob das Volume frisch
    # initialisiert oder aus einem früheren Lauf (Superuser postgres) übernommen
    # wurde. So hängt der Healthcheck nicht von der Existenz der Rolle
    # "knowledge" ab, die bei einem einmal initialisierten Volume fehlen kann.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  backend:
    build: ./backend
    container_name: knowledge-hub-backend
    environment:
      PG_HOST: db
      PG_PORT: "5432"
      PG_USER: knowledge
      PG_PASSWORD: knowledge
      PG_DATABASE: knowledge
      PORT: "3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: knowledge-hub-frontend
    environment:
      PORT: "8081"
    ports:
      - "8081:8081"
    depends_on:
      - backend

volumes:
  db-data:
